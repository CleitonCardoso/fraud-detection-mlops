[project]
name = "fraud-detection-mlops"
version = "1.0.0"
description = "MLOps system for credit card fraud detection — FIAP MLET Datathon Phase 05"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "torch>=2.3",
    "shap>=0.45",
    "imbalanced-learn>=0.12",
    "mlflow>=2.11",
    "dvc>=3.47",
    "pandera>=0.18",
    "faker>=24.0",
    "pyyaml>=6.0",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]
agent = [
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "langgraph>=0.1",
    "faiss-cpu>=1.8",
    "openai>=1.30",
    "ragas>=0.1",
    "langfuse>=2.0",
]
monitoring = [
    "evidently>=0.4",
    "prometheus-client>=0.20",
]
security = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806"]  # N803/N806: uppercase X/X_train is standard ML notation

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src --cov-report=term-missing --cov-fail-under=60"
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B101",   # assert statements in tests
    "B110",   # try/except/pass — intentional fallback for optional Ollama/OpenAI
    "B310",   # urllib.urlopen — internal Ollama health-check, URL from trusted env var
    "B404",   # subprocess import — used only to read git SHA (read-only, no user input)
    "B603",   # subprocess with list — hard-coded git command, no user-controlled input
    "B607",   # partial path in subprocess — git command, no user-controlled input
]

[tool.coverage.run]
omit = [
    "src/models/mlp.py",
    "src/models/train.py",
    "src/monitoring/drift.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
