name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[ml,serving,agent,monitoring,security,dev]"

      - name: Lint
        run: ruff check src/ tests/ evaluation/

      - name: Type check
        run: mypy src/ --ignore-missing-imports

      - name: Security scan
        run: bandit -r src/ -c pyproject.toml

      - name: Tests
        run: pytest tests/ -x --cov=src --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/serving/Dockerfile
          push: false
