name: Retrain

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force retraining even if no drift detected"
        required: false
        default: "false"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    outputs:
      retrain_needed: ${{ steps.check.outputs.retrain_needed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[ml,serving,monitoring]"

      - name: Run drift detection
        id: drift
        run: python src/monitoring/drift.py
        continue-on-error: true

      - name: Read drift status
        id: check
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" == "true" ]; then
            echo "retrain_needed=true" >> $GITHUB_OUTPUT
            echo "Forced retrain requested"
          elif [ -f data/processed/drift_status.json ]; then
            RETRAIN=$(python3 -c "import json; d=json.load(open('data/processed/drift_status.json')); print(str(d['retrain_needed']).lower())")
            echo "retrain_needed=$RETRAIN" >> $GITHUB_OUTPUT
            echo "Drift status: retrain_needed=$RETRAIN"
          else
            echo "retrain_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            data/processed/drift_report.html
            data/processed/drift_status.json

  retrain:
    needs: drift-check
    if: needs.drift-check.outputs.retrain_needed == 'true'
    runs-on: ubuntu-latest
    environment: production     # requires manual approval before retraining touches the registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[ml,serving,monitoring]"

      - name: Run training pipeline (champion-challenger)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: fraud-detection
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python src/models/train.py

      - name: Summary
        run: |
          echo "## Retrain complete" >> $GITHUB_STEP_SUMMARY
          if [ -f data/processed/drift_status.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/processed/drift_status.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
